<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Year Grid Calendar To-Do</title>
    <style>
        :root {
            --bg-color: #f5d0f2;
            --card-bg: #f5e6d0;
            --text-color: #000;
            --primary-color: #fff;
            --border-color: #000;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .month-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .month-name {
            text-align: center;
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.2rem;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 5px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
            font-size: 0.85rem;
        }

        .day-header {
            font-weight: bold;
            color: #fff;
            padding: 5px 0;
        }

        .day {
            padding: 8px 0;
            background: var(--bg-color);
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }

        .day:hover {
            background: #000;
        }

        .day.has-tasks::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: var(--primary-color);
            border-radius: 50%;
        }

        .day.empty {
            background: transparent;
            cursor: default;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .close-btn {
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
            background: none;
        }

        .todo-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .todo-input-group input {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .todo-input-group button {
            padding: 8px 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .delete-task {
            color: #000;
            cursor: pointer;
            background: none;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="year-title"></h1>
    </header>

    <div class="year-grid" id="yearGrid"></div>

        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalDateTitle">To-Do List</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="todo-input-group">
                <input type="text" id="todoInput" placeholder="Add a new task...">
                <button onclick="addTask()">Add</button>
            </div>
            <ul class="todo-list" id="todoList"></ul>
        </div>
    </div>

    <script>
        const currentYear = new Date().getFullYear();
        document.getElementById('year-title').innerText = `${currentYear} Calendar Dashboard`;

        const months = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];
        const daysOfWeek = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
        
        let todoStorage = JSON.parse(localStorage.getItem('gridCalendarTodos')) || {};

        let selectedDateKey = "";

        function initCalendar() {
            const yearGrid = document.getElementById('yearGrid');
            yearGrid.innerHTML = '';

            months.forEach((month, monthIndex) => {
                const monthCard = document.createElement('div');
                monthCard.className = 'month-card';

                const monthName = document.createElement('h3');
                monthName.className = 'month-name';
                monthName.innerText = month;
                monthCard.appendChild(monthName);

                const daysGrid = document.createElement('div');
                daysGrid.className = 'days-grid';

                daysOfWeek.forEach(day => {
                    const dayHeader = document.createElement('div');
                    dayHeader.className = 'day-header';
                    dayHeader.innerText = day;
                    daysGrid.appendChild(dayHeader);
                });

                const firstDayIndex = new Date(currentYear, monthIndex, 1).getDay();
                const totalDays = new Date(currentYear, monthIndex + 1, 0).getDate();

                for (let i = 0; i < firstDayIndex; i++) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'day empty';
                    daysGrid.appendChild(emptyDiv);
                }

                for (let dayNum = 1; dayNum <= totalDays; dayNum++) {
                    const dayDiv = document.createElement('div');
                    dayDiv.className = 'day';
                    dayDiv.innerText = dayNum;

                    const dateKey = `${currentYear}-${monthIndex + 1}-${dayNum}`;
                    if (todoStorage[dateKey] && todoStorage[dateKey].length > 0) {
                        dayDiv.classList.add('has-tasks');
                    }

                    dayDiv.onclick = () => openModal(dateKey, `${month} ${dayNum}, ${currentYear}`);
                    daysGrid.appendChild(dayDiv);
                }

                monthCard.appendChild(daysGrid);
                yearGrid.appendChild(monthCard);
            });
        }

        function openModal(dateKey, formattedDate) {
            selectedDateKey = dateKey;
            document.getElementById('modalDateTitle').innerText = formattedDate;
            document.getElementById('todoModal').style.display = 'flex';
            renderTasks();
        }

        function closeModal() {
            document.getElementById('todoModal').style.display = 'none';
            document.getElementById('todoInput').value = '';
            initCalendar();
        }

        function renderTasks() {
            const listElement = document.getElementById('todoList');
            listElement.innerHTML = '';
            const tasks = todoStorage[selectedDateKey] || [];

            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = 'todo-item';
                li.innerHTML = `
                    <span>${task}</span>
                    <button class="delete-task" onclick="deleteTask(${index})">✕</button>
                `;
                listElement.appendChild(li);
            });
        }

        function addTask() {
            const input = document.getElementById('todoInput');
            const taskText = input.value.trim();
            if (!taskText) return;

            if (!todoStorage[selectedDateKey]) {
                todoStorage[selectedDateKey] = [];
            }

            todoStorage[selectedDateKey].push(taskText);
            localStorage.setItem('gridCalendarTodos', JSON.stringify(todoStorage));
            input.value = '';
            renderTasks();
        }

        function deleteTask(index) {
            todoStorage[selectedDateKey].splice(index, 1);
            if (todoStorage[selectedDateKey].length === 0) {
                delete todoStorage[selectedDateKey];
            }
