<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calendar Task Planner</title>
    <style>
        body { font-family: Times New Roman, Arial; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; width: 100%; max-width: 600px; }
        .day { border: 1px solid #ffae42; min-height: 80px; padding: 5px; cursor: pointer; }
        .day:hover { background: #ffc6ca; }
        .task { background: #007bff; color: white; font-size: 12px; margin-top: 4px; padding: 2px 4px; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>My Calendar Tasks</h1>
    <div class="calendar" id="calendarGrid"></div>

    <script>
        const grid = document.getElementById('calendarGrid');
        for (let i = 1; i <= 31; i++) {
            const day = document.createElement('div');
            day.className = 'day';
            day.innerHTML = `<strong>${i}</strong>`;
            day.onclick = () => {
                const taskText = prompt("Enter task for day " + i + ":");
                if (taskText) {
                    const taskDiv = document.createElement('div');
                    taskDiv.className = 'task';
                    taskDiv.textContent = taskText;
                    day.appendChild(taskDiv);
                }
            };
            grid.appendChild(day);
        }
    </script>
</body>
</html>
