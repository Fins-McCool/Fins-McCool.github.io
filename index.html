<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calendar To-Do List</title>
    <style>
        body { font-family: Times New Roman, Arial; max-width: 600px; margin: 40px auto; padding: 20px; background: #ffd3c6; }
        h1, h2 { color: #000; }
        .box { background: #ffd4b4; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, button { padding: 10px; font-size: 16px; margin-right: 5px; }
        ul { padding-left: 20px; }
        li { margin: 10px 0; cursor: pointer; }
        .completed { text-decoration: line-through; color: #fff; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Calendar</h1>
        <input type="date" id="selected-date">
        <p>Selected date tasks will show below.</p>
    </div>

    <div class="box">
        <h2>To-Do List</h2>
        <input type="text" id="task-input" placeholder="Add a new task...">
        <button onclick="addTask()">Add</button>
        <ul id="task-list"></ul>
    </div>

    <script>
        const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        const taskList = document.getElementById('task-list');

        function renderTasks() {
            taskList.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.textContent = task.text;
                if (task.completed) li.classList.add('completed');
                li.onclick = () => toggleTask(index);
                taskList.appendChild(li);
            });
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function addTask() {
            const input = document.getElementById('task-input');
            const dateInput = document.getElementById('selected-date');
            if (input.value.trim() === '') return;
            tasks.push({ text: `${input.value} (${dateInput.date || 'No Date'})`, completed: false });
            input.value = '';
            renderTasks();
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        }

        renderTasks();
    </script>
</body>
</html>
