<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Yearly Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>📅 My 2027 Planner</h1>
    <div id="planner-container" class="year-grid"></div>

    <div id="task-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modal-date-title">Add Task</h3>
            <input type="text" id="task-input" placeholder="Enter task description...">
            <div class="modal-buttons">
                <button id="save-task-btn">Save</button>
                <button id="close-modal-btn">Cancel</button>
            </div>
            <ul id="day-tasks-list"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
